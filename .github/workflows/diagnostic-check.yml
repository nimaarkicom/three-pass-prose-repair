name: Diagnostic script regression check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run diagnose.py against both example fixtures
        run: |
          python3 scripts/diagnose.py examples/formulaic.txt
          python3 scripts/diagnose.py examples/natural.txt

      - name: Fail if the two fixtures stop scoring differently
        run: python3 scripts/test_examples.py
