name: Validate SKILL.md frontmatter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate SKILL.md frontmatter parses
        run: python3 scripts/validate_frontmatter.py SKILL.md
